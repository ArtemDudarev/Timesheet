x-postgres-common: &postgres-common
  image: postgres:15-alpine
  environment:
    POSTGRES_USER: ${DB_USER}
    POSTGRES_PASSWORD: ${DB_PASSWORD}
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d postgres"]
    interval: 10s
    timeout: 5s
    retries: 5
  networks:
    - app-network

x-service-common: &service-common
  restart: unless-stopped
  env_file:
    - .env
  networks:
    - app-network

services:

  # =========================
  # AUTH DB
  # =========================
  auth_db:
    <<: *postgres-common
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${AUTH_DB_PORT}:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data

  auth_service:
    <<: *service-common
    build: ./services/auth_service
    ports:
      - "${AUTH_SERVICE_PORT}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@auth_db:5432/auth_db
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_GROUP_ID: auth-service
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}  # Задать в .env для VPS
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Лимит считается по IP: ручной прогон с перелогинами упирается в дефолтные 5/мин
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-30/minute}
      RESET_REQUEST_RATE_LIMIT: ${RESET_REQUEST_RATE_LIMIT:-10/minute}
    depends_on:
      auth_db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # =========================
  # PROFILE DB
  # =========================
  profile_db:
    <<: *postgres-common
    environment:
      POSTGRES_DB: profile_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${PROFILE_DB_PORT}:5432"
    volumes:
      - profile_db_data:/var/lib/postgresql/data

  profile_service:
    <<: *service-common
    build: ./services/profile_service
    ports:
      - "${PROFILE_SERVICE_PORT}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@profile_db:5432/profile_db
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_GROUP_ID: profile-service
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      profile_db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # =========================
  # MANAGEMENT DB
  # =========================
  management_db:
    <<: *postgres-common
    environment:
      POSTGRES_DB: management_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${MANAGEMENT_DB_PORT}:5432"
    volumes:
      - management_db_data:/var/lib/postgresql/data

  management_service:
    <<: *service-common
    build: ./services/management_service
    ports:
      - "${MANAGEMENT_SERVICE_PORT}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@management_db:5432/management_db
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_GROUP_ID: management-service
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      management_db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # =========================
  # TIMESHEET DB
  # =========================
  ts_db:
    <<: *postgres-common
    environment:
      POSTGRES_DB: ts_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${TIMESHEET_DB_PORT}:5432"
    volumes:
      - ts_db_data:/var/lib/postgresql/data

  timesheet_service:
    <<: *service-common
    build: ./services/timesheet_service
    ports:
      - "${TIMESHEET_SERVICE_PORT}:8004"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@ts_db:5432/ts_db
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_GROUP_ID: timesheet-service
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      ts_db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # =========================
  # ABSENCE DB
  # =========================
  absence_db:
    <<: *postgres-common
    environment:
      POSTGRES_DB: absence_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${ABSENCE_DB_PORT}:5432"
    volumes:
      - absence_db_data:/var/lib/postgresql/data

  absence_service:
    <<: *service-common
    build: ./services/absence_service
    ports:
      - "${ABSENCE_SERVICE_PORT}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@absence_db:5432/absence_db
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_GROUP_ID: absence-service
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      absence_db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # =========================
  # REPORTING DB
  # =========================
  reporting_db:
    <<: *postgres-common
    environment:
      POSTGRES_DB: reporting_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${REPORTING_DB_PORT}:5432"
    volumes:
      - reporting_db_data:/var/lib/postgresql/data

  reporting_service:
    <<: *service-common
    build: ./services/reporting_service
    ports:
      - "${REPORTING_SERVICE_PORT}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@reporting_db:5432/reporting_db
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_GROUP_ID: reporting-service
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      reporting_db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # =========================
  # DOCUMENT DB
  # =========================
  document_db:
    <<: *postgres-common
    environment:
      POSTGRES_DB: document_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DOCUMENT_DB_PORT}:5432"
    volumes:
      - document_db_data:/var/lib/postgresql/data

  document_service:
    <<: *service-common
    build: ./services/document_service
    ports:
      - "${DOCUMENT_SERVICE_PORT}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@document_db:5432/document_db
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_GROUP_ID: document-service
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - document_files:/data/files
    depends_on:
      document_db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # =========================
  # NOTIFICATION DB
  # =========================
  notification_db:
    <<: *postgres-common
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${NOTIFICATION_DB_PORT}:5432"
    volumes:
      - notification_db_data:/var/lib/postgresql/data

  notification_service:
    <<: *service-common
    build: ./services/notification_service
    ports:
      - "${NOTIFICATION_SERVICE_PORT}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@notification_db:5432/notification_db
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_GROUP_ID: notification-service
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      notification_db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # =========================
  # CHAT DB
  # =========================
  chat_db:
    <<: *postgres-common
    environment:
      POSTGRES_DB: chat_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${CHAT_DB_PORT}:5432"
    volumes:
      - chat_db_data:/var/lib/postgresql/data

  chat_service:
    <<: *service-common
    build: ./services/chat_service
    ports:
      - "${CHAT_SERVICE_PORT}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@chat_db:5432/chat_db
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_GROUP_ID: chat-service
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      chat_db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # =========================
  # KAFKA
  # =========================
  kafka:
    image: confluentinc/cp-kafka:latest
    ports:
      - "${KAFKA_EXTERNAL_PORT}:9092"
      - "${KAFKA_CONTROLLER_PORT}:29093"

    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: >
        PLAINTEXT://:${KAFKA_INTERNAL_PORT},
        CONTROLLER://:${KAFKA_CONTROLLER_PORT},
        PLAINTEXT_HOST://:9092

      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka:${KAFKA_INTERNAL_PORT},
        PLAINTEXT_HOST://localhost:${KAFKA_EXTERNAL_PORT}

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@kafka:${KAFKA_CONTROLLER_PORT}

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - app-network

  # =========================
  # KAFKA UI
  # =========================
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "${KAFKA_UI_PORT}:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

    depends_on:
      - kafka

    networks:
      - app-network

volumes:
  auth_db_data:
  profile_db_data:
  management_db_data:
  ts_db_data:
  absence_db_data:
  reporting_db_data:
  document_db_data:
  document_files:
  notification_db_data:
  chat_db_data:
  kafka_data:

networks:
  app-network:
    driver: bridge
