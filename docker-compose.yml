x-postgres-common: &postgres-common
  image: postgres:15-alpine
  environment:
    POSTGRES_USER: ${DB_USER}
    POSTGRES_PASSWORD: ${DB_PASSWORD}
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d postgres"]
    interval: 10s
    timeout: 5s
    retries: 5
  networks:
    - app-network

x-service-common: &service-common
  restart: unless-stopped
  env_file:
    - .env
  networks:
    - app-network

services:

  # =========================
  # AUTH DB
  # =========================
  auth_db:
    <<: *postgres-common
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${AUTH_DB_PORT}:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data

  auth_service:
    <<: *service-common
    build: ./services/auth_service
    ports:
      - "${AUTH_SERVICE_PORT}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@auth_db:5432/auth_db
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_GROUP_ID: auth-service
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}  # Задать в .env для VPS
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      auth_db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # =========================
  # PROFILE DB
  # =========================
  profile_db:
    <<: *postgres-common
    environment:
      POSTGRES_DB: profile_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${PROFILE_DB_PORT}:5432"
    volumes:
      - profile_db_data:/var/lib/postgresql/data

  profile_service:
    <<: *service-common
    build: ./services/profile_service
    ports:
      - "${PROFILE_SERVICE_PORT}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@profile_db:5432/profile_db
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_GROUP_ID: profile-service
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      profile_db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # =========================
  # MANAGER DB
  # =========================
  manager_db:
    <<: *postgres-common
    environment:
      POSTGRES_DB: manager_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${MANAGER_DB_PORT}:5432"
    volumes:
      - manager_db_data:/var/lib/postgresql/data

  manager_service:
    <<: *service-common
    build: ./services/manager_service
    ports:
      - "${MANAGER_SERVICE_PORT}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@manager_db:5432/manager_db
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_GROUP_ID: manager-service
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      manager_db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # =========================
  # TIMESHEET DB
  # =========================
  ts_db:
    <<: *postgres-common
    environment:
      POSTGRES_DB: ts_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${TIMESHEET_DB_PORT}:5432"
    volumes:
      - ts_db_data:/var/lib/postgresql/data

  # =========================
  # KAFKA
  # =========================
  kafka:
    image: confluentinc/cp-kafka:latest
    ports:
      - "${KAFKA_EXTERNAL_PORT}:9092"
      - "${KAFKA_CONTROLLER_PORT}:29093"

    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: >
        PLAINTEXT://:${KAFKA_INTERNAL_PORT},
        CONTROLLER://:${KAFKA_CONTROLLER_PORT},
        PLAINTEXT_HOST://:9092

      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka:${KAFKA_INTERNAL_PORT},
        PLAINTEXT_HOST://localhost:${KAFKA_EXTERNAL_PORT}

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@kafka:${KAFKA_CONTROLLER_PORT}

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - app-network

  # =========================
  # KAFKA UI
  # =========================
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "${KAFKA_UI_PORT}:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

    depends_on:
      - kafka

    networks:
      - app-network

volumes:
  auth_db_data:
  profile_db_data:
  manager_db_data:
  ts_db_data:
  kafka_data:

networks:
  app-network:
    driver: bridge
